<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบทำใบเสนอราคา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Noto+Serif+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2937;--bd:#d1d5db;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#e5e7eb;--bd:#4b5563;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#e5e7eb;--bd:#4b5563;--ac:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',sans-serif;font-size:15px}
.wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;margin:8px 0 2px}
input,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 28px;gap:6px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.item .d{grid-column:1/-1}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--ac);background:none;color:var(--ac);cursor:pointer}
button.p{background:var(--ac);color:#fff}
.x{padding:0;border-color:var(--bd);color:#dc2626}
.paper-wrap{overflow-x:auto}
#paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:15mm 18mm;margin:auto;box-shadow:0 2px 10px #0003;font-family:'Noto Serif Thai',serif;font-size:13px;line-height:1.5}
#paper table{width:100%;border-collapse:collapse;table-layout:fixed}
#paper th,#paper td{border:1px solid #000;padding:2px 6px;vertical-align:top;overflow-wrap:anywhere}
#paper th{font-weight:400;text-align:center;padding:6px}
#paper td{height:26px}
#paper .nb{border:none}
.r{text-align:right}.c{text-align:center}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.wrap{display:block;padding:0}.card.form{display:none}
 .paper-wrap{overflow:visible}#paper{box-shadow:none;margin:0}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card form">
 <h2>ข้อมูลใบเสนอราคา</h2>
 <div class="row"><div><label>ชื่อผู้เสนอราคา / บริษัท</label><input id="co" value="นาย ชัยวัฒน์ แสงกุดเรือ"></div><div><label>โทร</label><input id="tel" value="087-126-9998"></div></div>
 <label>เลขที่ / NO</label><input id="no">
 <label>เรียน</label><input id="cu">
 <label>ราคางาน</label><input id="job">
 <h2 style="margin-top:14px">รายการ</h2>
 <div id="items"></div>
 <button onclick="addItem()">+ เพิ่มรายการ</button>
 <div style="margin-top:8px"><label>VAT (%) — ใส่ 0 ถ้าไม่มี VAT</label><input id="vat" type="number" value="7"></div>
 <p style="margin-top:14px"><button class="p" onclick="window.print()">ดาวน์โหลด PDF</button>
 <small style="display:block;margin-top:6px;opacity:.7">ในหน้าต่างพิมพ์ เลือกเครื่องพิมพ์เป็น "บันทึกเป็น PDF"</small></p>
</div>
<div class="paper-wrap"><div id="paper"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],U=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function conv(s){
 if(s.length>6)return conv(s.slice(0,-6))+'ล้าน'+conv(s.slice(-6));
 let r='';const L=s.length;
 for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
  if(p==1)r+=(d==1?'':d==2?'ยี่':D[d])+'สิบ';
  else if(p==0)r+=(d==1&&L>1)?'เอ็ด':D[d];
  else r+=D[d]+U[p];}
 return r;
}
function baht(n){
 const t=Math.round(n*100),b=Math.floor(t/100),s=t%100;
 let r=(b?conv(String(b)):'ศูนย์')+'บาท';
 return r+(s?conv(String(s))+'สตางค์':'ถ้วน');
}
function addItem(c='',d='',q='',u='',p=''){
 const e=document.createElement('div');e.className='item';
 e.innerHTML=`<input class="d" placeholder="รายการ (DESCRIPTION)" value="${esc(d)}"><input class="c" placeholder="รหัส" value="${esc(c)}"><input class="q" type="number" placeholder="จำนวน" value="${q}"><input class="u" placeholder="หน่วย" value="${esc(u)}"><input class="p" type="number" placeholder="ราคา/หน่วย" value="${p}"><button class="x" onclick="this.parentNode.remove();render()">×</button>`;
 $('items').appendChild(e);render();
}
function render(){
 let sub=0,rows='',n=0;
 document.querySelectorAll('.item').forEach(e=>{
  const g=k=>e.querySelector('.'+k).value;
  const q=+g('q')||0,p=+g('p')||0,t=q*p;sub+=t;n++;
  rows+=`<tr><td class="c">${esc(g('c'))||n}</td><td>${esc(g('d'))}</td><td class="c">${q?q+' '+esc(g('u')):''}</td><td class="c">${p?fmt(p):''}</td><td class="c">${t?fmt(t):''}</td></tr>`;
 });
 for(;n<7;n++)rows+=`<tr><td class="c">${n+1}</td><td></td><td></td><td></td><td></td></tr>`;
 const vr=+$('vat').value||0,v=sub*vr/100,g=sub+v;
 $('paper').innerHTML=`
 <div style="font-weight:700;font-size:14px">${esc($('co').value)}</div>
 <div style="font-weight:700">Tel : ${esc($('tel').value)}</div>
 <div class="c" style="margin:-4px 0 0 0"><div style="font-weight:700;font-size:14px;margin-top:6px">ใบเสนอราคา</div><div style="font-weight:700;margin-top:10px">QUOTATION</div></div>
 <div class="r" style="margin:12px 0 10px">เลขที่/NO ${esc($('no').value)}</div>
 <div>เรียน ${esc($('cu').value)}</div>
 <div style="margin-bottom:6px">ราคางาน ${esc($('job').value)}</div>
 <table>
 <colgroup><col style="width:14%"><col style="width:41%"><col style="width:13%"><col style="width:16%"><col style="width:16%"></colgroup>
 <tr><th>รหัสสินค้า<br>ITEM CODE</th><th>รายการ<br>DESCRIPTION</th><th>จำนวน</th><th>ราคาต่อหน่วย</th><th>จำนวนเงิน<br>AMOUNT</th></tr>
 ${rows}
 <tr><td colspan="2" class="nb"></td><td colspan="2" class="nb r">รวมเป็นเงิน</td><td class="c">${fmt(sub)}</td></tr>
 <tr><td colspan="2" class="nb c">(${baht(g)})</td><td colspan="2" class="nb r">VAT ${vr}%</td><td class="c">${vr?fmt(v):'-'}</td></tr>
 <tr><td colspan="2" class="nb"></td><td colspan="2" class="nb r">รวมเป็นเงินทั้งหมดทั้งสิ้น</td><td class="c" style="color:#e00000">${fmt(g)}</td></tr>
 </table>`;
}
document.querySelector('.form').addEventListener('input',render);
addItem();addItem();addItem();
</script>
</body>
</html>
